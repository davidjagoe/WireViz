
connectors:

  # Util
  # CONTACTS:
  #   pins: [11, 14]
  #   show_pincount: false

  # Customer
  +DCS-MODBUS:
    type: By others
    pins: [D1, D0, COM, SHIELD]
    show_pincount: false
    notes: |
      Modbus RTU, RS485
      Shield ground at DCS end

  +SIS-XESD:
    type: By others
    pins: [+, -]
    show_pincount: false
    notes: 48 VDC ESD Power
  
  +DCS-DISCRETE:
    type: By others
    pinlabels: [ESD Alarm +, ESD Alarm -, 
                Auto Alarm +, Auto Alarm -, 
                Trouble Alarm +, Trouble Alarm -,
                Mode Bit 0 +, Mode Bit 0 -,
                Mode Bit 1 +, Mode Bit 1 -,
                Mode Bit 2 +, Mode Bit 2]
    show_pincount: false
  
  +DCS-ANALOG:
    type: By others
    pinlabels: [ #SHIELD, 
                ZC +, ZC -, SHIELD,
                ZI +, ZC -, SHIELD,
                PT ACC +, PT ACC -, SHIELD,
                PT A +, PT A -, SHIELD,
                PT B +, PT B -, SHIELD]
    show_pincount: false
  
  +SUPPLY-X400:
    type: By others
    pins: [L1, L2, L3, N, PE]
    show_pincount: false

  +SUPPLY-X230:
    type: By others
    pins: [L, N]
    show_pincount: false

  +LOCAL-EARTH:
    type: By others
    style: simple
    image:
      src: ./img/pe-symbol.png
      caption: Local Earth
      width: 50


  # Main Control Panel
  +MCP/6Q1:
    type: Circuit breaker
    pins: [1, 3, 5, N]
    show_pincount: false

  +MCP/6Q2:
    type: Circuit breaker
    pins: [1, 3]
    show_pincount: false

  +MCP-XEA:
    pins: [1, 2]
    pinlabels: [PE, PE]
    show_pincount: false

  +MCP-XESD: &esd
    pins: [1, 2]
    show_pincount: false

  +MCP-X1:
    pins: [PE, 1, 2, 3, 4, 5, 6]
    show_pincount: false

  +MCP-X2:
    pins: [1, 2, 3, 4, 5, 6]
    show_pincount: false

  +MCP-X4: &field-analog-terminals
    pins: [1U, 1M, 1L, 2U, 2M, 2L, 3U, 3M, 3L, 4U, 4M, 4L, 5U, 5M, 5L, SHIELD]
    show_pincount: false
    image:
      src: ./img/3-deck-analog-earthing.png
      caption: 3-deck fuse terminal block with shield to rail.   
      width: 200

  +MCP-X3:
    pincount: 12
    show_pincount: false
    notes: |
      Loop power supplied by DCS.
      MCP discrete outputs are dry contacts.

  +MCP-X5(T1):
    pins: [1U, 1M, 1L]
    show_pincount: false
    notes: Loop power supplied by MCP power supply unit.
    image:
      src: ./img/3-deck-analog-earthing.png
      caption: 3-deck fuse terminal block with shield to rail.
      width: 200

  +MCP-X5(T2-T5):
    pins: [2U, 2M, 2L, 3U, 3M, 3L, 4U, 4M, 4L, 5U, 5M, 5L]
    show_pincount: false
    notes: Loop power supplied by MCP signal isolator.
    image:
      src: ./img/3-deck-knife.png
      caption: 3-deck knife disconnect terminal block with shield to rail.
      width: 200

  +MCP-X6:
    pincount: 6
    show_pincount: false

  # Drive Panel
  +DP-X1: &dp-x1
    pins: [PE, 1, 2, 3, 4]
    show_pincount: false

  +DP-X2: &dp-x2
    pins: [PE, 1, 2, 3, 4]
    show_pincount: false

  +DP-X3: &dp-x3
    pincount: 16
    show_pincount: false

  +DP-X4: &dp-x4
    pincount: 16
    show_pincount: false


  # Actuator Junction Box
  +AJB-XEA:
    pins: [PE]
    show_pincount: false

  +AJB-X1-MCP:
    pins: [1, 2L, 3U, 4U, 5U, 6U]
    pincolors: [None, BU, BU, BU, BU, BU]
    show_pincount: false
    image:
      src: ./img/3-deck-upper.png
      caption: Use the upper terminal that is marked blue.
      width: 200
    notes: |
      * Terminal 3U means land the wire on the upper deck of the block.    
      * Note that there are two of each block 3-6.
      * (Terminals for field wiring marked BU for clarity.)
      
  +AJB-X2-MCP:
    pins: [1U, 2L, 3L, 4L, 5L, 6L]
    pincolors: [BU, BU, BU, BU, BU, BU]
    show_pincount: false
    image:
      src: ./img/3-deck-lower.png
      caption: |
        Use the terminal that is marked blue.
        (Upper for T1, lower for 2-6.)
      width: 200
    notes: |
      * Terminal 3U means land the wire on the upper deck of the block.    
      * Note that there are two of each block 3-6.
      * (Terminals for field wiring marked BU for clarity.)

  +AJB-X4-MCP:
    <<: *field-analog-terminals
    image:
      src: ./img/3-deck-analog-thru.png
      caption: 3-deck through terminal block.
      width: 200
    

  +AJB-X1:
    <<: *dp-x1

  +AJB-X2:
    <<: *dp-x2

  +AJB-X3:
    <<: *dp-x3

  +AJB-X4:
    <<: *dp-x4

  +AJB-XESD:
    pins: [1L, 1U, 2L, 2U]
    show_pincount: false
    notes: Upper terminals for solenoid connections.


