connectors:

  # Customer
  +SIS-XESD:
    pins: [xx, yy]
    show_pincount: false
    notes: Details by others
  
  +SUPPLY-X400:
    pins: [L1, L2, L3, N, PE]
    show_pincount: false
    notes: Details by others


  +SUPPLY-X230:
    pins: [L, N]
    show_pincount: false
    notes: Details by others

  +LOCAL-EARTH:
    style: simple
    image:
      src: ./img/pe-symbol.png
      caption: Local Earth
      width: 50


  # Main Control Panel
  +MCP/6Q1:
    pins: [1, 3, 5, N]
    show_pincount: false
    notes: Circuit breaker

  +MCP/6Q2:
    pins: [1, 3]
    show_pincount: false
    notes: Circuit breaker

  +MCP-XEA:
    pins: [1, 2]
    pinlabels: [PE, PE]
    show_pincount: false

  +MCP-XESD: &esd
    pins: [1, 2]
    show_pincount: false

  +MCP-X1:
    pins: [PE, 1, 2, 3, 4, 5, 6]
    show_pincount: false

  +MCP-X2:
    pins: [1, 2, 3, 4, 5, 6]
    show_pincount: false

  +MCP-X4: &field-analog-terminals
    pins: [1U, 1M, 1L, 2U, 2M, 2L, 3U, 3M, 3L, 4U, 4M, 4L, 5U, 5M, 5L, 6U, 6M, 6L, 7U, 7M, 7L]
    show_pincount: false
    image:
      src: ./img/3-deck-analog-earthing.png
      caption: 3-deck terminal block with shield to rail.
      width: 200

  # Drive Panel
  +DP-X1: &dp-x1
    pins: [PE, 1, 2, 3, 4]
    show_pincount: false

  +DP-X2: &dp-x2
    pins: [PE, 1, 2, 3, 4]
    show_pincount: false

  +DP-X3: &dp-x3
    pincount: 9
    show_pincount: false

  +DP-X4: &dp-x4
    pincount: 9
    show_pincount: false


  # Actuator Junction Box
  +AJB-XEA:
    pins: [PE]
    show_pincount: false

  +AJB-X1-MCP:
    pins: [1, 2L, 3U, 4U, 5U, 6U]
    pincolors: [None, BU, BU, BU, BU, BU]
    show_pincount: false
    image:
      src: ./img/3-deck-upper.png
      caption: Use the upper terminal that is marked blue.
      width: 200
    notes: |
      * Terminal 3U means land the wire on the upper deck of the block.    
      * Note that there are two of each block 3-6.
      * (Terminals for field wiring marked BU for clarity.)
      
  +AJB-X2-MCP:
    pins: [1U, 2L, 3L, 4L, 5L, 6L]
    pincolors: [BU, BU, BU, BU, BU, BU]
    show_pincount: false
    image:
      src: ./img/3-deck-lower.png
      caption: |
        Use the terminal that is marked blue.
        (Upper for T1, lower for 2-6.)
      width: 200
    notes: |
      * Terminal 3U means land the wire on the upper deck of the block.    
      * Note that there are two of each block 3-6.
      * (Terminals for field wiring marked BU for clarity.)

  +AJB-X4-MCP:
    <<: *field-analog-terminals
    image:
      src: ./img/3-deck-analog-thru.png
      caption: 3-deck through terminal block.
      width: 200
    

  +AJB-X1:
    <<: *dp-x1

  +AJB-X2:
    <<: *dp-x2

  +AJB-X3:
    <<: *dp-x3

  +AJB-X4:
    <<: *dp-x4

  +AJB-XESD:
    pins: [1L, 1U, 2L, 2U]
    show_pincount: false
    notes: Upper terminals for solenoid connections.


cables:

  ACTUATOR-PE:
    category: bundle
    length: 25 ft
    wirecount: 1
    colors: [GNYE]
    pn: HOLD
    manufacturer: HOLD
    mpn: HOLD
    notes: O.D. HOLD

  ACTUATOR-DISCRETE:
    # gauge:
    # show_equiv: true
    length: 25 ft
    # color: BK
    color_code: DIN
    wirecount: 5
    pn: HOLD
    manufacturer: Lapp
    mpn: HOLD
    notes: O.D. HOLD

  ACTUATOR-DC-POWER:
    # gauge:
    # show_equiv: true
    length: 25 ft
    # color: BK
    color_code: DIN
    wirecount: 6
    pn: HOLD
    manufacturer: Lapp
    mpn: HOLD
    notes: O.D. HOLD

  ACTUATOR-ANALOG:
    gauge: 0.5
    show_equiv: true
    length: 25 ft
    color: BK
    colors: [BK, WH, SR, BK, WH, SR, BK, WH, SR, BK, WH, SR, BK, WH, SR, BK, WH, SR, BK, WH, SR, BK, WH, SR]
    wirelabels: [1(BK), 1(WH), SHIELD (PAIR 1), 2(BK), 2(WH), SHIELD (PAIR 2), 3(BK), 3(WH), SHIELD (PAIR 3), 4(BK), 4(WH), SHIELD (PAIR 4), 5(BK), 5(WH), SHIELD (PAIR 5), 6(BK), 6(WH), SHIELD (PAIR 6), 7(BK), 7(WH), SHIELD (PAIR 7), 8(BK), 8(WH), SHIELD (PAIR 8)]
    inner_shields: [SHIELD (PAIR 1), SHIELD (PAIR 2), SHIELD (PAIR 3), SHIELD (PAIR 4), SHIELD (PAIR 5), SHIELD (PAIR 6), SHIELD (PAIR 7), SHIELD (PAIR 8)]
    show_wirenumbers: false
    pn: HOLD
    manufacturer: Lapp
    mpn: 0032450
    notes: |
      O.D. 0.567 in
      Pair 8 unused. Coil and insulate at both ends.

  ESD-STATUS:
    gauge: 1
    show_equiv: true
    length: 25 ft
    color: BK
    color_code: DIN
    wirecount: 2
    pn: HOLD
    manufacturer: Lapp
    mpn: 1030279
    notes: O.D. 0.22 in

  M1-POWER: &motor_power
    gauge: 12 AWG
    show_equiv: true
    length: 25 ft
    color: BK
    colors: [BK, BK, BK, GNYE]
    wirecount: 4
    shield: true
    pn: 10300516
    manufacturer: LUTZE
    mpn: A3311204
    notes: OD 0.437 in (11.1 mm)

  M2-POWER:
    <<: *motor_power
    
  M1-RESOLVER: &resolver
    length: 25 ft
    color: GN
    colors: [WH, BN, SR, GN, YE, SR, PK, GY]
    wirelabels: [PR1(A+), PR1(A-), SHIELD (PAIR 1), PR2(B+), PR2(B-), SHIELD (PAIR 2), V+, V-]
    inner_shields: [SHIELD (PAIR 1), SHIELD (PAIR 2)]
    shield: true
    pn: 103xxxxx
    manufacturer: Lapp
    mpn: 0036929
    show_wirecount: false
    show_wirenumbers: false
    notes: |
      Resolver cable
      2 x (2 x 0.25 mm) + 2 x 0.5 mm
      O.D. 0.343 in (8.7 mm)
    
  M2-RESOLVER:
    <<: *resolver

# Customer provided cables
  SIS-ESD:
    wirecount: 2
    notes: |
      Supplied by others
      Details by others

  SUPPLY-400V:
    colors: [BKBN, BK, BKGY, LB, GNYE]
    notes: |
      Supplied by others
      Details by others
    
  SUPPLY-230V:
    colors: [BN, LB]
    notes:  |
      Supplied by others
      Details by others

  LOCAL-EARTH:
    colors: [GNYE]
    notes:  |
      Supplied by others
      Details by others


